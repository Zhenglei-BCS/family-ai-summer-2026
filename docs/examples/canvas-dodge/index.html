<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sky Catch — mini game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Sky Catch</h1>
      <p class="hint">Move with ← → or A/D. Catch the orbs. Avoid the spikes.</p>
    </header>

    <div class="hud">
      <span>Score: <strong id="score">0</strong></span>
      <span>Lives: <strong id="lives">3</strong></span>
      <span>Best: <strong id="best">0</strong></span>
    </div>

    <canvas id="game" width="480" height="640" aria-label="Sky Catch game canvas"></canvas>

    <div class="controls">
      <button type="button" id="btn-left" aria-label="Move left">◀</button>
      <button type="button" id="btn-start">Start</button>
      <button type="button" id="btn-right" aria-label="Move right">▶</button>
    </div>

    <p class="footer-note">Built as a static demo — works offline and on GitHub Pages.</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
